services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: codeql_lab
      POSTGRES_USER: lab_user
      POSTGRES_PASSWORD: lab_password
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_user -d codeql_lab"]
      interval: 5s
      timeout: 3s
      retries: 10
